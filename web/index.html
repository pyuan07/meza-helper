<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <meta charset="UTF-8">
  <meta name="theme-color" content="#121212">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MezaHelper">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MezaHelper</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/@zxing/library@0.20.0" defer></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // PWA Update Notifier Logic (Industry Standard - Unregister & Reload)
    window.pwaUpdateAvailable = false;
    window.pwaRegistration = null;

    // Called from Dart to trigger the update
    window.pwaUnregisterAndReload = function() {
      if (window.pwaRegistration) {
        window.pwaRegistration.unregister().then(function() {
          window.location.reload();
        });
      } else {
        window.location.reload();
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        
        // 0. Pre-warm the ZXing reader so it's ready when the user clicks scan
        // We use a small timeout to not compete with initial Flutter rendering
        setTimeout(() => {
           try {
             getZxReader();
             console.log("ZXing Scanner pre-warmed.");
           } catch(e) {
             console.log("ZXing pre-warm failed (might load later):", e);
           }
        }, 3000);

        navigator.serviceWorker.getRegistration().then(function(reg) {
          if (!reg) return;
          
          window.pwaRegistration = reg;

          // 1. Check if there's already a waiting worker (update downloaded but waiting)
          if (reg.waiting) {
            window.pwaUpdateAvailable = true;
            console.log("PWA: New version waiting.");
          }

          // 2. Listen for new updates
          reg.addEventListener('updatefound', function() {
            var newWorker = reg.installing;
            console.log("PWA: Update found, installing...");
            
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                 // New update available and installed
                 console.log("PWA: New version installed and waiting.");
                 window.pwaUpdateAvailable = true;
                 
                 // Notify Dart if the callback is registered
                 if (window.onPwaUpdateCallback) {
                   window.onPwaUpdateCallback();
                 }
              }
            });
          });
        });
      });
    }
  </script>
  <script>
    // Global reader instance to prevent re-initialization cost on every scan
    let zxingReader = null;

    function getZxReader() {
      if (!zxingReader && window.ZXing) {
        zxingReader = new ZXing.BrowserMultiFormatReader();
      }
      return zxingReader;
    }

    // Helper to scan QR from image URL (Blob URL)
    async function scanBarcodeFromImageUrl(imageUrl) {
      const reader = getZxReader();
      if (!reader) {
        console.error("ZXing library not loaded or failed to initialize.");
        return null;
      }
      
      const maxRetries = 3;
      for (let i = 0; i < maxRetries; i++) {
        try {
          // decodeFromImageElement would require creating an element, 
          // decodeFromImageUrl works with url
          const result = await reader.decodeFromImageUrl(imageUrl);
          return result.text;
        } catch (err) {
          console.warn(`ZXing scan attempt ${i + 1} failed:`, err);
          if (i === maxRetries - 1) {
             console.error("All ZXing scan attempts failed.");
             return null;
          }
          // Wait before retrying (e.g., 500ms)
          await new Promise(resolve => setTimeout(resolve, 500));
        }
      }
      return null;
    }
  </script>
</body>
</html>
