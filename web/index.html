<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MezaHelper">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MezaHelper</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // PWA Update Notifier Logic
    window.onUpdateAvailable = null;
    window.triggerUpdate = function() {
      // Force reload ignoring cache
      window.location.reload();
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function(reg) {
        // Check if there is already a waiting service worker
        if (reg.waiting) {
          if (window.onUpdateAvailable) window.onUpdateAvailable("New version waiting");
        }

        // Listen for new updates
        reg.addEventListener('updatefound', function() {
          var newWorker = reg.installing;
          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
               // New update available
               console.log("New service worker installed and waiting.");
               if (window.onUpdateAvailable) window.onUpdateAvailable("Update available");
            }
          });
        });
      });
    }
  </script>
  <script>
    // Helper to scan QR from image URL (Blob URL)
    async function scanBarcodeFromImageUrl(imageUrl) {
      try {
        const codeReader = new ZXing.BrowserMultiFormatReader();
        // decodeFromImageElement would require creating an element, 
        // decodeFromImageUrl works with url
        const result = await codeReader.decodeFromImageUrl(imageUrl);
        return result.text;
      } catch (err) {
        console.error("ZXing scan error:", err);
        return null;
      }
    }
  </script>
</body>
</html>
