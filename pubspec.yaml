name: meza_helper
description: A utility app for Pokemon Mezastar.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Utilities
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  screen_brightness: ^0.2.1
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.2
  uuid: ^4.3.3
  flutter_svg: ^2.0.9
  url_launcher: ^6.3.2
  http: ^1.6.0
  audioplayers: ^6.5.1
  google_fonts: ^6.1.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/qr_codes/
    - assets/images/tags/ver1/
    - assets/images/tags/ver2/
    - assets/images/tags/ver3/
    - assets/images/tags/ver4/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
